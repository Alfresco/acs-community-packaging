name: Pre-Commit formatter

on:
  push:
    branches:
      - precommit/**

env:
  JAVA_VERSION: "21"

jobs:
  format-code:
    name: "Reformat code"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    if: contains(github.event.head_commit.message, '[reformat code]')
    steps:
      - uses: actions/checkout@v7
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@v19.14.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@v19.14.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v19.14.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@837a4dfd80d15ec3bc05b9168b97e0864aa3066c # v19.14.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: --all-files
      - name: Update secrets baseline
        run: pip install detect-secrets && detect-secrets scan --baseline .secrets.baseline
      - uses: Alfresco/alfresco-build-tools/.github/actions/git-commit-changes@v19.14.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          add-options: -u
          commit-message: "Apply Pre-Commit code formatting"
          skip-if-no-changes: true
      - name: Push changes
        run: git push
